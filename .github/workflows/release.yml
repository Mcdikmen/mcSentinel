name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release zip
        run: |
          mkdir -p dist
          zip -r dist/mcSentinel.zip . \
            --exclude "*.git*" \
            --exclude ".github/*" \
            --exclude ".obsidian/*" \
            --exclude "docs/*" \
            --exclude "dist/*"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "mcSentinel ${{ github.ref_name }}"
          body: |
            ## mcSentinel ${{ github.ref_name }}

            ### Installation
            1. Download `mcSentinel.zip` and extract it into your `resources/[standalone]/` folder.
            2. Add `ensure mcSentinel` to your `server.cfg` (after `qbx_core` and `oxmysql`).
            3. Configure your Discord webhook and thresholds in `shared/config.lua`.
          files: dist/mcSentinel.zip
          draft: false
          prerelease: false
